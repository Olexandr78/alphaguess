name: Arduino compile checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  avr-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and optional libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "DFRobotDFPlayerMini"
      - name: Compile Uno examples
        shell: bash
        run: |
          set -euo pipefail
          for sketch in \
            BasicModules \
            I2C_LCD \
            Joystick_Encoder \
            Stepper_SevenSegment_Audio \
            DisplayControllers \
            SD_Card \
            ServoMotor \
            TFT_AdafruitGFX \
            DFPlayer_Mini
          do
            echo "Compiling $sketch"
            arduino-cli compile --fqbn arduino:avr:uno --library "$GITHUB_WORKSPACE" "examples/$sketch"
          done
