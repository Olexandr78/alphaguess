name: Arduino compile checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  avr-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and optional libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "Servo"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "DFRobotDFPlayerMini"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit BMP280 Library"
      - name: Compile Uno examples
        shell: bash
        run: |
          set -euo pipefail
          for sketch in \
            BasicModules \
            I2C_LCD \
            Parallel_LCD \
            Joystick_Encoder \
            Stepper_SevenSegment_Audio \
            DisplayControllers \
            SD_Card \
            ServoMotor \
            TFT_ST7735S_SUI \
            TFT_AdafruitGFX \
            OLED_SSD1306 \
            DFPlayer_Mini \
            Environmental_Sensors
          do
            echo "Compiling $sketch"
            arduino-cli compile --fqbn arduino:avr:uno --library "$GITHUB_WORKSPACE" "examples/$sketch"
          done

  camera-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Nano 33 BLE core and OV767X library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:mbed_nano
          arduino-cli lib install Arduino_OV767X
      - name: Compile OV7670 example
        run: arduino-cli compile --fqbn arduino:mbed_nano:nano33ble --library "$GITHUB_WORKSPACE" examples/OV7670_Capture


  esp32-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and optional libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit BMP280 Library"
      - name: Compile ESP32-compatible examples
        shell: bash
        run: |
          set -euo pipefail
          for sketch in \
            BasicModules \
            I2C_LCD \
            Parallel_LCD \
            Joystick_Encoder \
            Stepper_SevenSegment_Audio \
            DisplayControllers \
            SD_Card \
            ServoMotor \
            TFT_ST7735S_SUI \
            TFT_AdafruitGFX \
            OLED_SSD1306 \
            Environmental_Sensors
          do
            echo "Compiling ESP32: $sketch"
            arduino-cli compile --fqbn esp32:esp32:esp32 --library "$GITHUB_WORKSPACE" "examples/$sketch"
          done
